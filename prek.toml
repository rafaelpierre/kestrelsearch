minimum_prek_version = "0.4.14"
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format (changed Python files)"
entry = "uv run --frozen ruff format --check"
language = "system"
types = ["python"]
pass_filenames = true

[[repos.hooks]]
id = "ruff-check"
name = "ruff check (changed Python files)"
entry = "uv run --frozen ruff check"
language = "system"
types = ["python"]
pass_filenames = true

[[repos.hooks]]
id = "ty-check"
name = "ty check (changed Python files)"
entry = "uv run --frozen ty check"
language = "system"
types = ["python"]
pass_filenames = true

[[repos.hooks]]
id = "complexipy"
name = "complexipy (changed Python files)"
entry = "uv run --frozen complexipy --max-complexity-allowed 15"
language = "system"
types = ["python"]
files = "^src/.*\\.py$"
pass_filenames = true
