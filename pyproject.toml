[project]
name = "duckduckscrape"
version = "0.1.0"
description = "Lightweight DuckDuckGo web search tool for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.1",
    "fake-useragent>=2.2.0",
    "httpx[http2]>=0.28.1",
    "lxml>=6.0.2",
    "rank-bm25>=0.2.2",
    "jinja2>=3.1",
    "tomlkit>=0.13",
]

[project.scripts]
duckduckscrape = "duckduckscrape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckduckscrape"]
