[project]
name = "kestrelsearch"
version = "1.0.1"
description = "Web search, page extraction, and relevance ranking for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.1",
    "curl-cffi>=0.13.0",
    "fake-useragent>=2.2.0",
    "httpx[http2]>=0.28.1",
    "lxml>=6.0.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "rank-bm25>=0.2.2",
    "tenacity>=9.1.2",
    "jinja2>=3.1",
    "tomlkit>=0.13",
]

[project.scripts]
kestrelsearch = "kestrelsearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrelsearch"]

[tool.semantic_release]
branch = "main"
build_command = "uv lock --upgrade-package kestrelsearch && uv build"
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.publish]
upload_to_vcs_release = false

[dependency-groups]
dev = [
    "arize-phoenix>=20.4.0",
    "complexipy>=7.0.1",
    "prek>=0.4.14",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-semantic-release>=10.6.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.pytest.ini_options]
addopts = "--cov=kestrelsearch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
